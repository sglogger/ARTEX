services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: ${ARTEX_IMAGE:-dgddw/artex}:${ARTEX_TAG:-latest}
    # platform is not pinned: Docker picks linux/amd64 or linux/arm64 automatically based on the host.
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      # First-run protection. Left empty, a random setup token is printed to the startup log
      # (docker compose logs artex) and must be entered on /setup to create the admin password.
      # ARTEX_ADMIN_PASSWORD initialises the password directly without /setup (8+ characters).
      ARTEX_SETUP_TOKEN: ${ARTEX_SETUP_TOKEN:-}
      ARTEX_ADMIN_PASSWORD: ${ARTEX_ADMIN_PASSWORD:-}
      # Browser cross-origin allowlist (comma-separated). The embedded UI is same-origin, so usually empty.
      ARTEX_CORS_ORIGINS: ${ARTEX_CORS_ORIGINS:-}
    ports:
      # Published on the host's 127.0.0.1 by default. To reach it from other machines set
      # ARTEX_BIND=0.0.0.0 in .env, but finish the initial setup first and prefer a reverse proxy (HTTPS).
      - "${ARTEX_BIND:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the data directory (including jwt.key, SQLite, etc.) to data/ in the project root,
      # so it can be inspected/backed up directly on the host and survives container recreation.
      - ./data:/app/data
      # Mount the project root's skills into the container (overriding the image's built-in /app/skills);
      # editing a skill needs no image rebuild, the container reads the host's copy.
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
